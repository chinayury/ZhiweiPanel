# ZhiweiPanel 容器内 nginx 主配置
#
# 与 alpine 官方默认 nginx.conf 的唯一实质差异，是 **include 的位置**：
#
#   面板下发的配置里既有 http 级指令（00-zhiweipanel-http.conf 里的
#   log_format / limit_req_zone），也有 server 块（01- 与 10-site-*.conf）。
#   这两类指令都只能出现在 `http { }` 内。alpine 默认把
#   `include /etc/nginx/conf.d/*.conf` 放在 **root context**（http 块之外），
#   直接挂载面板目录会直接报：
#       nginx: [emerg] "log_format" directive is not allowed here
#
# 这里把 conf.d 挪进 http { }，其余保持 alpine 的默认调优。
#
# 注意：本文件由镜像内置，不要把它放进 nginx-conf 卷——卷挂载在
# /etc/nginx/conf.d 上，不会覆盖 /etc/nginx/nginx.conf。

user nginx;

worker_processes auto;

# pid 路径显式固定（main context 指令，不能放进 http {}）：
# alpine 打包默认写 /run/nginx/nginx.pid，宿主机（Debian/Ubuntu）是
# /run/nginx.pid。固定成前者，让面板的运行状态探测
# （internal/driver/hostdriver）在容器内也能从 pid 文件读到「在运行」。
pid /run/nginx/nginx.pid;

# 启用正则表达式的 JIT，加快正则匹配。
pcre_jit on;

error_log /var/log/nginx/error.log warn;

# 动态模块
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 1m;
    sendfile on;
    tcp_nopush on;

    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # 同名 shared zone 全仓尺寸必须一致：站点级（internal/nginx/render.go
    # buildTLS）也声明 shared:SSL:10m，nginx 对同名不同尺寸直接 emerg
    # （"the size ... conflicts with already declared size"）。该冲突只在
    # docker 部署路径出现（宿主部署用发行版 nginx.conf 无此行），
    # 尺寸一致性由 internal/nginx/ssl_cache_size_test.go 常驻锁死。
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    gzip_vary on;

    # WebSocket 代理辅助变量
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # 面板下发目录：00-zhiweipanel-http.conf（http 级）、
    # 01-zhiweipanel-default-server.conf（catch-all）、10-site-<id>.conf（站点）。
    include /etc/nginx/conf.d/*.conf;

    # 用户自定义扩展目录（默认空，放自定义 vhost 用）。
    # 发行版自带的 default.conf 在镜像构建阶段已删除，否则会与面板的
    # catch-all default_server 冲突。
    include /etc/nginx/http.d/*.conf;
}
